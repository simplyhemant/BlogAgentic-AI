[project]
name = "blogagentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hemant Singh", email = "171360192+simplyhemant@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.4",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "uvicorn>=0.52.4",
    "watchdog>=6.0.0",
]

[project.scripts]
blogagentic = "blogagentic:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
